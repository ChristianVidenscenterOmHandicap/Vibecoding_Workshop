<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tilgængeligheds-RPG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20252b;font-family:Arial,sans-serif;overflow:hidden}
#game{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100vw;max-height:100vh;background:#9bcf73;box-shadow:0 0 40px rgba(0,0,0,.45)}
</style></head>
<body><div id="game"><canvas id="canvas" width="960" height="640"></canvas></div>
<script>
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d"),TILE=48;
const player={x:4,y:7};let solved=false,message="Find en måde at gøre indgangen tilgængelig på.";
const map=["####################","#..................#","#....######........#","#....#....#........#","#....#....##########","#....#.............#","#....#....#####....#","#....D....#...#....#","#.........#...#....#","#.........#####....#","#..................#","####################"];
const puzzle={x:7,y:7};
function tile(x,y,t){let p=x*TILE,q=y*TILE;if(t=="#"){ctx.fillStyle="#587c52";ctx.fillRect(p,q,TILE,TILE);ctx.fillStyle="#6f965c";ctx.fillRect(p+4,q+4,TILE-8,TILE-8);ctx.fillStyle="#4a6d47";ctx.fillRect(p+8,q+30,6,5);ctx.fillRect(p+28,q+13,7,6)}else{ctx.fillStyle="#9bcf73";ctx.fillRect(p,q,TILE,TILE);ctx.fillStyle="#8bc265";ctx.fillRect(p+8,q+9,3,3);ctx.fillRect(p+32,q+30,3,3);ctx.fillRect(p+18,q+38,2,2)}}
function door(x,y){let p=x*TILE,q=y*TILE;ctx.fillStyle=solved?"#76b852":"#b94b4b";ctx.fillRect(p+7,q+3,TILE-14,TILE-6);ctx.fillStyle="#f5e7c8";ctx.fillRect(p+15,q+11,TILE-30,TILE-22);ctx.fillStyle=solved?"#467d3b":"#8f3737";ctx.fillRect(p+27,q+23,5,5)}
function puzzleDraw(){let p=puzzle.x*TILE,q=puzzle.y*TILE;ctx.fillStyle="#403b68";ctx.fillRect(p+8,q+8,TILE-16,TILE-16);ctx.fillStyle="#e9d66b";ctx.fillRect(p+15,q+13,18,5);ctx.fillRect(p+15,q+23,18,5);ctx.fillRect(p+15,q+33,18,5);if(!solved){ctx.fillStyle="#fff4a3";ctx.font="bold 18px Arial";ctx.textAlign="center";ctx.fillText("?",p+24,q+27)}}
function playerDraw(){let x=player.x*TILE+24,y=player.y*TILE+24;ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(x,y+15,15,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#315c9b";ctx.beginPath();ctx.arc(x,y+5,13,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f1c39a";ctx.beginPath();ctx.arc(x,y-9,11,0,Math.PI*2);ctx.fill();ctx.fillStyle="#49372e";ctx.beginPath();ctx.arc(x,y-13,11,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle="#222";ctx.fillRect(x-5,y-10,3,3);ctx.fillRect(x+3,y-10,3,3)}
function ui(){ctx.fillStyle="rgba(30,38,45,.94)";ctx.fillRect(20,20,920,76);ctx.fillStyle="#fff";ctx.font="bold 20px Arial";ctx.textAlign="left";ctx.fillText("MISSION: Gør stedet tilgængeligt",40,49);ctx.font="16px Arial";ctx.fillStyle="#d9e1e5";ctx.fillText(solved?"Indgangen er nu tilgængelig. Udforsk området!":"Find kontrolpanelet og løs puslespillet.",40,76);ctx.fillStyle="rgba(30,38,45,.94)";ctx.fillRect(20,555,920,65);ctx.fillStyle="#fff";ctx.font="17px Arial";ctx.fillText(message,40,594);ctx.textAlign="right";ctx.font="14px Arial";ctx.fillStyle="#bfcbd1";ctx.fillText("Piletaster / WASD  •  E = interagér",920,615);ctx.textAlign="left"}
function draw(){ctx.clearRect(0,0,960,640);for(let y=0;y<map.length;y++)for(let x=0;x<map[y].length;x++)tile(x,y,map[y][x]);door(5,7);if(!solved)puzzleDraw();else{ctx.fillStyle="#d6b878";ctx.fillRect(5*TILE+5,7*TILE+5,TILE-10,TILE-10);ctx.fillStyle="#efe0ad";ctx.fillRect(5*TILE+10,7*TILE+10,TILE-20,TILE-20)}playerDraw();ui()}
function can(x,y){if(y<0||y>=map.length||x<0||x>=map[0].length||map[y][x]=="#")return false;if(x==5&&y==7&&!solved)return false;return true}
function move(dx,dy){let x=player.x+dx,y=player.y+dy;if(can(x,y)){player.x=x;player.y=y;message=solved?"Du bevæger dig frit gennem området.":"Der er fri passage her."}else message=(x==5&&y==7&&!solved)?"Indgangen er ikke tilgængelig endnu.":"Du kan ikke komme den vej.";draw()}
function interact(){let d=Math.abs(player.x-puzzle.x)+Math.abs(player.y-puzzle.y);if(d<=1&&!solved){solved=true;message="Puslespil løst! En rampe gør nu indgangen tilgængelig."}else if(player.x==5&&player.y==7&&solved)message="Du passerer gennem den tilgængelige indgang.";else message="Der er ikke noget at interagere med her.";draw()}
document.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();switch(e.key.toLowerCase()){case"arrowup":case"w":move(0,-1);break;case"arrowdown":case"s":move(0,1);break;case"arrowleft":case"a":move(-1,0);break;case"arrowright":case"d":move(1,0);break;case"e":interact();break}});draw();
</script></body></html>
